<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File System Recovery Tool</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">
    <h1>File System Recovery & Optimization Tool</h1>

    <div class="input-section">
        <input type="text" id="file" placeholder="Enter file name">
        <input type="text" id="data" placeholder="Enter data">
    </div>

    <div class="buttons">
        <button id="txnBtn">Transaction</button>
        <button id="crashBtn">Crash</button>
        <button id="recBtn">Recovery</button>
        <button id="cacheBtn">Cache</button>
        <button id="clearBtn">Clear Logs</button>
    </div>

    <div class="output">
        <h3>Output</h3>
        <pre id="outputBox">System output will appear here...</pre>
    </div>
</div>

<script src="/script.js"></script>

</body>
</html>
