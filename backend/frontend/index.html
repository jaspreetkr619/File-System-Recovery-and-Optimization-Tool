<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File System Simulator</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">

    <h1>File System Recovery & Optimization Tool</h1>

    <!-- Input Section -->
    <div class="section">
        <h2>Input Parameters</h2>

        <div class="input-section">
            <input type="text" id="file" placeholder="File Name">
            <input type="text" id="data" placeholder="Data / Value">
        </div>
    </div>

    <!-- Core Operations -->
    <div class="section">
        <h2>Core Operations</h2>

        <div class="buttons">
            <button id="txnBtn">Perform Transaction</button>
            <button id="crashBtn">Simulate Crash</button>
            <button id="recBtn">Run Recovery</button>
        </div>
    </div>

    <!-- Optimization & System -->
    <div class="section">
        <h2>System & Optimization</h2>

        <div class="buttons">
            <button id="cacheBtn">View Cache</button>
            <button id="clearBtn">Clear Logs</button>
        </div>
    </div>

    <!-- Future Extension (Important for Integration) -->
    <div class="section">
        <h2>Additional Modules</h2>

        <div class="buttons">
            <button disabled>Module 1 (Integration)</button>
            <button disabled>Module 2 (Integration)</button>
        </div>
    </div>

    <!-- Output -->
    <div class="section output">
        <h2>System Output</h2>
        <pre id="outputBox">System output will appear here...</pre>
    </div>

</div>

<script src="/script.js"></script>

</body>
</html>
